name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except the actual publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: npm install
      - name: Pack check
        run: npm pack --dry-run
      - name: Publish
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: |
          npm view @vi3ion/opencode version dist-tags --json
          echo "published: $(npm view @vi3ion/opencode version)"
