name: Publish npm package

# Publishing paths, in order:
#   1. npm Trusted Publishing (OIDC) - no secret needed, the runner's identity
#      is exchanged for a short-lived publish token.
#   2. A token from the NPM_TOKEN secret - only used when no trusted publisher
#      is configured for this repository.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except the actual publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Point npm at the registry
        # No registry-url here on purpose: setup-node would write an
        # _authToken line into .npmrc, and npm then refuses to use the OIDC
        # identity because a (placeholder) token is configured.
        run: |
          echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
          echo "//registry.npmjs.org/:_authToken=" >> "$HOME/.npmrc"
      - name: Install
        run: npm install
      - name: Use a recent npm
        # Trusted Publishing (OIDC) needs npm >= 11.5; Node 20 ships npm 10.
        # npm 12 requires Node >= 22, so pin the 11.x line for Node 20 runners.
        run: |
          npm install -g npm@11.5.1
          npm --version
      - name: Pack check
        run: npm pack --dry-run
      - name: Detect the publishing path
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish (token)
        if: ${{ (github.event_name == 'release' || inputs.dry_run == false) && steps.auth.outputs.mode == 'token' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish (Trusted Publishing / OIDC)
        if: ${{ (github.event_name == 'release' || inputs.dry_run == false) && steps.auth.outputs.mode == 'oidc' }}
        # verbose: npm only explains an OIDC failure (e.g. "no trusted
        # publisher") at that level, which makes the job diagnosable.
        run: npm publish --access public --provenance --loglevel=verbose
        env:
          # setup-node writes a placeholder token into .npmrc; npm would use it
          # instead of the OIDC identity. An empty value makes npm fall back to
          # the trusted-publishing exchange.
          NODE_AUTH_TOKEN: ""
      - name: Verify
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: |
          PKG=$(npm pkg get name | tr -d '"')
          echo "published: $(npm view "$PKG" version)"
          npm view "$PKG" dist-tags --json
