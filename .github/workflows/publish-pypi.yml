name: Publish to PyPI

# Trusted Publishing: PyPI exchanges this workflow's OIDC identity for a
# short-lived upload token, so no API token is stored anywhere.
# Setup (one time, in the PyPI UI):
#   1. create the project "vi3ion" on pypi.org
#   2. project -> Manage -> Publishing -> add a GitHub publisher
#      owner: Subadeepan-Y, repository: VI3ION, workflow: publish-pypi.yml
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, do not upload"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vi3ion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check
        run: twine check dist/*
      - name: Publish
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/
